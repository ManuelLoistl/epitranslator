<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Disease Model Translator</title>
<style>
  :root {
    --bg: #0f1419;
    --panel: #1a212b;
    --border: #2b3645;
    --text: #e6edf3;
    --muted: #8b97a7;
    --accent: #e8692d;
    --accent-hover: #f47b40;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .meta { color: var(--muted); font-size: 12px; }
  header .meta code { color: var(--accent); }
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--border);
    min-height: 0;
  }
  .pane { background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .pane-head {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .pane-head label { font-size: 13px; color: var(--muted); }
  .pane-head input[type=text] {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 12px;
    width: 140px;
  }
  .pane-head select {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 12px;
  }
  textarea, pre {
    flex: 1;
    margin: 0;
    border: 0;
    padding: 16px;
    background: var(--panel);
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.5;
    resize: none;
    overflow: auto;
    white-space: pre;
    tab-size: 4;
  }
  textarea:focus { outline: none; }
  pre { white-space: pre-wrap; word-break: break-word; }
  footer {
    padding: 12px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
  }
  button {
    background: var(--accent);
    color: #fff;
    border: 0;
    border-radius: 8px;
    padding: 10px 22px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--accent-hover); }
  button:disabled { opacity: 0.5; cursor: default; }
  button.secondary { background: transparent; border: 1px solid var(--border); color: var(--muted); }
  .filebar { display:flex; align-items:center; gap:8px; padding:8px 16px;
             border-bottom:1px solid var(--border); }
  .mini { padding:4px 10px; font-size:12px; font-weight:500; border-radius:6px; }
  .files { flex:1; overflow:auto; display:flex; flex-direction:column; min-height:0; }
  .fileblock { display:flex; flex-direction:column; border-bottom:1px solid var(--border);
               flex-shrink:0; }
  .fileblock .fb-head { display:flex; gap:8px; align-items:center; padding:6px 16px 0; }
  .fileblock .fb-head input { flex:1; }
  .fileblock textarea { min-height:360px; }
  .fb-remove { background:transparent; border:0; color:var(--muted);
               cursor:pointer; font-size:16px; padding:0 6px; }
  .status { color: var(--muted); font-size: 13px; }
  .status.error { color: #f78a8a; }
  .report { border-top: 2px solid var(--accent); background: var(--panel);
            display: flex; flex-direction: column; min-height: 0; }
  .report[hidden] { display: none; }
  .report-head { padding: 8px 16px; font-size: 12px; font-weight: 600;
                 color: var(--muted); border-bottom: 1px solid var(--border); }
  .banner { display: flex; flex-direction: column; gap: 6px; padding: 10px 16px; }
  .banner:empty { display: none; }
  .att { border-radius: 6px; padding: 8px 10px; font-size: 12px; cursor: pointer; }
  .att .att-title { font-weight: 600; }
  .att .att-detail { color: var(--muted); margin-top: 4px; display: none; }
  .att.open .att-detail { display: block; }
  .att.high { background: #3a2016; border: 1px solid var(--accent); }
  .att.info { background: #1f2733; border: 1px solid var(--border); color: var(--muted); }
  .audit-bar { padding: 8px 16px; font-size: 12px; color: var(--muted); cursor: pointer;
               border-top: 1px solid var(--border); user-select: none; }
  .audit-body { display: none; max-height: 40vh; overflow: auto; padding: 0 16px 12px; }
  .audit-body.open { display: block; }
  .audit-body h4 { font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
  table.audit { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.audit td, table.audit th { text-align: left; padding: 4px 6px;
               border-bottom: 1px solid var(--border); vertical-align: top; }
  .badge { font-size: 10px; padding: 1px 6px; border-radius: 10px; }
  .badge.guessed { background: var(--accent); color: #fff; }
  .badge.derived, .badge.converted { background: #2b3645; color: var(--text); }
  .badge.source { background: transparent; color: var(--muted); }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6);
           display:flex; align-items:center; justify-content:center; z-index:50; padding:24px; }
  .modal[hidden] { display:none; }
  .modal-box { background: var(--panel); border:1px solid var(--border); border-radius:10px;
               width: min(900px, 100%); max-height: 85vh; display:flex; flex-direction:column; min-height:0; }
  .modal-head { display:flex; align-items:center; justify-content:space-between; gap:12px;
                padding:10px 16px; border-bottom:1px solid var(--border); font-size:12px; color:var(--muted); }
  .modal-box pre { padding:16px; overflow:auto; white-space:pre; }
</style>
</head>
<body>
  <header>
    <h1>Disease Model Translator</h1>
    <span class="meta" id="meta">loading config…</span>
    <button class="secondary mini" id="schemaBtn" style="margin-left:auto;">Schema reference</button>
  </header>

  <main>
    <section class="pane">
      <div class="pane-head">
        <label>Source model</label>
        <select id="category" title="Disease category (optional hint)"></select>
      </div>
      <div class="filebar">
        <button class="secondary mini" id="addFile">+ Add file</button>
        <label class="secondary mini" for="upload" style="cursor:pointer;">Upload files</label>
        <input type="file" id="upload" multiple hidden />
      </div>
      <div id="files" class="files"></div>
    </section>

    <section class="pane">
      <div class="pane-head">
        <label>Translated (target schema)</label>
        <span style="display:flex; gap:8px;">
          <button class="secondary" id="download" style="padding:4px 10px;font-size:12px;font-weight:500;">Download</button>
          <button class="secondary" id="copy" style="padding:4px 10px;font-size:12px;font-weight:500;">Copy</button>
        </span>
      </div>
      <pre id="output"></pre>
    </section>
  </main>

  <section class="report" id="report" hidden>
    <div class="report-head">Translation report — for review, not part of the code</div>
    <div class="banner" id="banner"></div>
    <div class="audit-bar" id="auditBar"></div>
    <div class="audit-body" id="auditBody"></div>
  </section>

  <div class="modal" id="schemaModal" hidden>
    <div class="modal-box">
      <div class="modal-head">
        <span>Target schema reference — the contract your translated model.py conforms to</span>
        <span style="display:flex; gap:8px;">
          <button class="secondary mini" id="schemaDownload">Download</button>
          <button class="secondary mini" id="schemaClose">Close</button>
        </span>
      </div>
      <pre id="schemaContent"></pre>
    </div>
  </div>

  <footer>
    <button id="translate">Translate</button>
    <button class="secondary" id="stop" style="display:none;">Stop</button>
    <span class="status" id="status"></span>
  </footer>

<script>
const $ = (id) => document.getElementById(id);
let controller = null;
let MAX_FILES = 10;

async function loadConfig() {
  try {
    const r = await fetch("/api/health");
    const j = await r.json();
    const c = j.config, a = j.assets;
    const keyWarn = c.api_key_present ? "" : " · ⚠ no API key set";
    $("meta").innerHTML =
      `model <code>${c.model}</code> · effort ${c.effort} · thinking ${c.thinking}` +
      ` · ${a.example_count} example(s)${keyWarn}`;
    const sel = $("category");
    for (const cat of (j.categories || [])) {
      const opt = document.createElement("option");
      opt.value = cat.id;
      opt.textContent = cat.label;
      sel.appendChild(opt);
    }
    if (typeof c.max_files === "number") { MAX_FILES = c.max_files; refreshAddState(); }
    if (pendingCategory) { $("category").value = pendingCategory; pendingCategory = null; }
  } catch (e) {
    $("meta").textContent = "could not load config";
  }
}

function addFileBlock(filename = "", content = "") {
  const list = $("files");
  if (list.children.length >= MAX_FILES) return null;
  const block = document.createElement("div");
  block.className = "fileblock";
  block.innerHTML =
    `<div class="fb-head">` +
    `<input type="text" class="fb-name" placeholder="filename (optional)" />` +
    `<button class="fb-remove" title="Remove">×</button></div>` +
    `<textarea class="fb-content" placeholder="Paste model source or parameter/data here…" spellcheck="false"></textarea>`;
  block.querySelector(".fb-name").value = filename;
  block.querySelector(".fb-content").value = content;
  block.querySelector(".fb-remove").addEventListener("click", () => {
    block.remove();
    if ($("files").children.length === 0) addFileBlock();
    refreshAddState();
    scheduleSave();
  });
  block.querySelector(".fb-content").addEventListener("keydown", (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter") translate();
  });
  list.appendChild(block);
  refreshAddState();
  return block;
}

function refreshAddState() {
  $("addFile").disabled = $("files").children.length >= MAX_FILES;
}

function collectFiles() {
  return [...$("files").children].map((b) => ({
    filename: b.querySelector(".fb-name").value.trim(),
    content: b.querySelector(".fb-content").value,
  })).filter((f) => f.content.trim());
}

// --- Browser-only session persistence (localStorage) ------------------------
const LS_KEY = "mt.session.v1";
let pendingCategory = null;   // restored before the category options exist
let saveTimer = null;

function collectFilesRaw() {   // keep every block (incl. partial) for persistence
  return [...$("files").children].map((b) => ({
    filename: b.querySelector(".fb-name").value,
    content: b.querySelector(".fb-content").value,
  }));
}
function saveSession() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      files: collectFilesRaw(),
      category: $("category").value,
      output: $("output").textContent,
    }));
  } catch (e) { /* quota / disabled — ignore */ }
}
function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(saveSession, 500); }
function restoreSession() {
  let s;
  try { s = JSON.parse(localStorage.getItem(LS_KEY) || "null"); } catch (e) { s = null; }
  if (!s) return false;
  $("files").innerHTML = "";
  const blocks = (s.files && s.files.length) ? s.files : [{ filename: "", content: "" }];
  for (const f of blocks.slice(0, MAX_FILES)) addFileBlock(f.filename || "", f.content || "");
  if ($("files").children.length === 0) addFileBlock();
  $("output").textContent = s.output || "";
  pendingCategory = s.category || null;
  return true;
}

function setRunning(running) {
  $("translate").disabled = running;
  $("stop").style.display = running ? "inline-block" : "none";
}

function resetReport() {
  $("report").hidden = true;
  $("banner").innerHTML = "";
  $("auditBody").innerHTML = "";
  $("auditBody").classList.remove("open");
  $("auditBar").textContent = "";
}

function showReportUnavailable() {
  $("banner").innerHTML =
    '<div class="att info"><div class="att-title">No translation report was produced for this run.</div></div>';
  $("auditBar").textContent = "";
  $("auditBody").innerHTML = "";
  $("auditBody").classList.remove("open");
  $("report").hidden = false;
}

function renderReport(r) {
  const att = r.attention || [];
  const banner = $("banner");
  banner.innerHTML = "";
  for (const a of att) {
    const el = document.createElement("div");
    el.className = "att " + (a.severity === "high" ? "high" : "info");
    el.innerHTML = `<div class="att-title">${escapeHtml(a.title || "")}</div>` +
                   `<div class="att-detail">${escapeHtml(a.detail || "")}</div>`;
    el.addEventListener("click", () => el.classList.toggle("open"));
    banner.appendChild(el);
  }

  const groups = [
    ["Compartments", r.compartments || [], (x) => [x.source_name, x.schema_id]],
    ["Parameters", r.parameters || [], (x) => [x.source_name, x.schema_name,
      x.value !== undefined ? String(x.value) : "", x.unit || ""]],
    ["Interventions", r.interventions || [], (x) => [x.source_name, x.schema_id,
      (x.target_rates || []).join(", ")]],
  ];
  const total = groups.reduce((n, g) => n + g[1].length, 0);
  const body = $("auditBody");
  body.innerHTML = "";
  for (const [name, rows, mapper] of groups) {
    if (!rows.length) continue;
    const h = document.createElement("h4");
    h.textContent = name;
    body.appendChild(h);
    const table = document.createElement("table");
    table.className = "audit";
    for (const row of rows) {
      const tr = document.createElement("tr");
      const cells = mapper(row);
      const mapping = (cells[0] ? escapeHtml(cells[0]) + " → " : "") + escapeHtml(cells[1] || "");
      const extra = cells.slice(2).filter(Boolean).map(escapeHtml).join(" · ");
      tr.innerHTML =
        `<td>${mapping}</td>` +
        `<td>${extra}</td>` +
        `<td><span class="badge ${escapeHtml(row.origin || "source")}">${escapeHtml(row.origin || "source")}</span></td>` +
        `<td>${escapeHtml(row.note || "")}</td>`;
      table.appendChild(tr);
    }
    body.appendChild(table);
  }

  $("auditBar").textContent = `Translation audit (${total}) ▸`;
  $("report").hidden = !(total || att.length);
}

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

async function translate() {
  const files = collectFiles();
  if (!files.length) { setStatus("Paste or upload some source first.", true); return; }

  $("output").textContent = "";
  resetReport();
  setStatus("Translating…");
  setRunning(true);
  controller = new AbortController();

  try {
    const resp = await fetch("/api/translate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        files,
        category: $("category").value,
      }),
      signal: controller.signal,
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    let bytes = 0;

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const parts = buf.split("\n\n");
      buf = parts.pop();
      for (const part of parts) {
        const line = part.trim();
        if (!line.startsWith("data:")) continue;
        const evt = JSON.parse(line.slice(5).trim());
        if (evt.error) { setStatus(evt.error, true); setRunning(false); return; }
        if (evt.done) { setStatus(`Done · ${bytes.toLocaleString()} chars`); setRunning(false); return; }
        if (evt.status) { setStatus(evt.status); }
        if (evt.report) { renderReport(evt.report); }
        if (evt.report_error) { showReportUnavailable(); }
        if (evt.text) {
          $("output").textContent += evt.text;
          bytes += evt.text.length;
          $("output").scrollTop = $("output").scrollHeight;
        }
      }
    }
    setStatus(`Done · ${bytes.toLocaleString()} chars`);
  } catch (e) {
    if (e.name === "AbortError") setStatus("Stopped.");
    else setStatus("Request failed: " + e.message, true);
  } finally {
    setRunning(false);
    saveSession();
  }
}

function setStatus(msg, isError) {
  const el = $("status");
  el.textContent = msg;
  el.className = "status" + (isError ? " error" : "");
}

$("translate").addEventListener("click", translate);
$("stop").addEventListener("click", () => controller && controller.abort());
$("auditBar").addEventListener("click", () => {
  const open = $("auditBody").classList.toggle("open");
  $("auditBar").textContent = $("auditBar").textContent.replace(/[▸▾]$/, open ? "▾" : "▸");
});
$("copy").addEventListener("click", () => {
  navigator.clipboard.writeText($("output").textContent);
  setStatus("Copied.");
});
$("addFile").addEventListener("click", () => addFileBlock());
$("upload").addEventListener("change", (e) => {
  const files = [...e.target.files];
  const free = MAX_FILES - $("files").children.length;
  let skipped = 0;
  files.forEach((file, i) => {
    if (i >= free) { skipped++; return; }
    const reader = new FileReader();
    reader.onload = () => { addFileBlock(file.name, reader.result); scheduleSave(); };
    reader.readAsText(file);
  });
  if (skipped) setStatus(`skipped ${skipped} (max ${MAX_FILES})`, true);
  e.target.value = "";
});

// --- Downloads ---------------------------------------------------------------
function downloadText(filename, text, mime) {
  const blob = new Blob([text], { type: mime || "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 0);
}
$("download").addEventListener("click", () => {
  const t = $("output").textContent;
  if (!t.trim()) { setStatus("Nothing to download yet.", true); return; }
  downloadText("model.py", t, "text/x-python");
});

// --- Schema reference doc ----------------------------------------------------
let schemaText = "";
async function loadSchemaDoc() {
  try { const r = await fetch("/api/docs"); const j = await r.json(); schemaText = j.schema || ""; }
  catch (e) { schemaText = ""; }
}
$("schemaBtn").addEventListener("click", async () => {
  if (!schemaText) await loadSchemaDoc();
  $("schemaContent").textContent = schemaText || "Schema reference unavailable.";
  $("schemaModal").hidden = false;
});
$("schemaClose").addEventListener("click", () => { $("schemaModal").hidden = true; });
$("schemaModal").addEventListener("click", (e) => {
  if (e.target === $("schemaModal")) $("schemaModal").hidden = true;
});
$("schemaDownload").addEventListener("click", () => {
  if (schemaText) downloadText("target_schema.py", schemaText, "text/x-python");
});

// --- Persistence wiring ------------------------------------------------------
$("files").addEventListener("input", scheduleSave);
$("category").addEventListener("change", saveSession);

// --- Init --------------------------------------------------------------------
if (!restoreSession()) addFileBlock();
loadConfig();
loadSchemaDoc();
</script>
</body>
</html>
